<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Efectivo</title>
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#14213d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Efectivo">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>
:root {
  color-scheme: light dark;
  --bg: #ffffff;
  --color-fg: #1f1e1c;
  --color-fg-muted: #6b6862;
  --color-bad: #c0392b;
  --color-ok: #2e7d4f;
  --color-border-line: #e4e1db;
  --color-panel: #f6f4f0;
  --cds-text-secondary: #6b6862;
  --cds-surface-popover: #ffffff;
  --cds-shadow-popover: 0 6px 20px rgba(0, 0, 0, .18);
  --cds-chart-grid: #e8e5df;
  --cds-border: #e4e1db;
  --cds-gap-xs: 6px; --cds-gap-sm: 8px; --cds-gap-md: 12px; --cds-gap-lg: 18px;
  --cds-pad-xs: 4px; --cds-pad-sm: 8px; --cds-pad-md: 12px; --cds-pad-lg: 16px;
  --cds-radius: 12px;
  --cds-font-size-caption: 12px; --cds-font-size-body: 15px; --cds-font-size-heading: 18px; --cds-font-size-title: 26px;
  --cds-font-weight-medium: 500;
  --cds-dur-slow: .3s;
  --font-anthropic-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-anthropic-serif: ui-serif, Georgia, "Times New Roman", serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #161514;
    --color-fg: #efede8;
    --color-fg-muted: #a39f97;
    --color-bad: #ef7a6c;
    --color-ok: #6cc08a;
    --color-border-line: #34322f;
    --color-panel: #201f1d;
    --cds-text-secondary: #a39f97;
    --cds-surface-popover: #262523;
    --cds-shadow-popover: 0 6px 20px rgba(0, 0, 0, .5);
    --cds-chart-grid: #2f2d2a;
    --cds-border: #34322f;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--color-fg); font-family: var(--font-anthropic-sans); font-size: var(--cds-font-size-body); -webkit-text-size-adjust: 100%; }
body { padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
[hidden] { display: none !important; }
#lock { min-height: 100dvh; display: flex; align-items: center; justify-content: center; padding: 24px; }
#lock-form { width: 100%; max-width: 340px; display: flex; flex-direction: column; gap: 14px; text-align: center; }
#lock-form img { width: 72px; height: 72px; margin: 0 auto; border-radius: 16px; }
#lock-form h1 { margin: 0; font-family: var(--font-anthropic-serif); font-weight: 400; font-size: 24px; }
#lock-pass { font: inherit; font-size: 18px; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--color-border-line); background: var(--color-panel); color: var(--color-fg); text-align: center; letter-spacing: .04em; }
#lock-btn { font: inherit; font-weight: 600; padding: 12px; border: 0; border-radius: 10px; background: #14213d; color: #fff; }
#lock-btn:disabled { opacity: .6; }
#lock-err { min-height: 1.2em; margin: 0; color: var(--color-bad); font-size: 14px; }
.lock-rem { display: flex; gap: 8px; align-items: center; justify-content: center; font-size: 13px; color: var(--color-fg-muted); }
.ef-bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 16px 0; max-width: 1100px; margin: 0 auto; font-size: 12px; color: var(--color-fg-muted); }
#bar-estado.bad { color: var(--color-bad); }
#bar-refresh { font: inherit; font-size: 18px; line-height: 1; width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--color-border-line); background: var(--color-panel); color: var(--color-fg); }
#bar-refresh.spin { animation: efspin 1s linear infinite; }
@keyframes efspin { to { transform: rotate(360deg); } }
#dash-root { padding: 8px 16px 40px; }
</style>
</head>
<body>
<main id="lock" hidden>
  <form id="lock-form" autocomplete="off">
    <img src="icon-192.png" alt="">
    <h1>Efectivo</h1>
    <input id="lock-pass" type="password" placeholder="Clave" autocomplete="current-password" autocapitalize="none" autocorrect="off" spellcheck="false" required>
    <p id="lock-err" role="alert"></p>
    <button id="lock-btn" type="submit">Entrar</button>
    <label class="lock-rem"><input id="lock-remember" type="checkbox" checked> Recordar en este celular</label>
  </form>
</main>
<div id="app" hidden>
  <div class="ef-bar"><span id="bar-estado">Cargando…</span><button id="bar-refresh" type="button" aria-label="Actualizar">↻</button></div>
  <div id="dash-root"></div>
</div>
<script src="d3.min.js"></script>
<script src="app.js"></script>
</body>
</html>
